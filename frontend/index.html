    <title>AegisBlast AI Code Blast Radius Analyzer</title>
    <script>
      // Unconditional safeguard against iframe/preview environment readonly fetch setter errors
      (function() {
        try {
          var origFetch = window.fetch || (typeof globalThis !== 'undefined' ? globalThis.fetch : undefined);
          var currentFetch = origFetch;
          var installFetchGuard = function(target) {
            if (!target) return;
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() { return currentFetch; },
                set: function(val) {
                  if (typeof val === 'function') {
                    currentFetch = val;
                  }
                },
                configurable: true,
                enumerable: true
              });
            } catch (err) {}
          };
          installFetchGuard(window);
          if (typeof globalThis !== 'undefined') installFetchGuard(globalThis);
          if (typeof self !== 'undefined') installFetchGuard(self);
        } catch (e) {
          // Ignore sandboxed errors
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
